<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد تقرير المبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c2b2a;
    --paper:#f4f2ec;
    --panel:#ffffff;
    --line:#dcd6c8;
    --teal:#1f5c56;
    --teal-dark:#123f3b;
    --clay:#c8683f;
    --muted:#7a7566;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:28px;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
  }
  header h1{
    font-size:22px;
    font-weight:900;
    margin:0;
  }
  header span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    letter-spacing:.04em;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:14px;
    font-weight:700;
    margin:0 0 14px;
    color:var(--teal-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .num{
    font-family:var(--mono);
    background:var(--teal-dark);
    color:#fff;
    width:22px;
    height:22px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
  }
  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    font-weight:700;
    background:#fbfaf6;
    color:var(--ink);
  }
  textarea{
    width:100%;
    min-height:150px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.7;
    background:#fbfaf6;
    color:var(--ink);
    resize:vertical;
    direction:ltr;
    text-align:left;
  }
  input[type=text]:focus, textarea:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(31,92,86,.12);
  }
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .filebtn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    background:#eee9d9;
    border:1px dashed var(--muted);
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    color:var(--teal-dark);
  }
  .filebtn input{display:none;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;}
  table.map{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  table.map th{
    text-align:right;
    font-size:11px;
    color:var(--muted);
    font-weight:500;
    padding:0 8px 8px;
  }
  table.map td{
    padding:5px 8px;
  }
  table.map input{
    padding:8px 10px;
    font-size:13px;
    font-weight:500;
  }
  table.map input.code{
    font-family:var(--mono);
    direction:ltr;
    text-align:center;
    width:100%;
  }
  .del{
    background:none;
    border:none;
    color:var(--clay);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:6px;
  }
  .addrow{
    margin-top:10px;
    background:none;
    border:1px solid var(--teal);
    color:var(--teal-dark);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    font-family:'Tajawal',sans-serif;
  }
  .generate{
    width:100%;
    padding:15px;
    background:var(--teal-dark);
    color:#fff;
    border:none;
    border-radius:9px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    font-family:'Tajawal',sans-serif;
    letter-spacing:.01em;
  }
  .generate:hover{background:var(--teal);}
  .output-wrap{position:relative;}
  #output{
    background:var(--teal-dark);
    color:#eef4f2;
    min-height:220px;
    border:none;
    direction:rtl;
    text-align:right;
    font-family:'Tajawal', sans-serif;
    font-size:14.5px;
    line-height:2;
    white-space:pre-wrap;
  }
  #output:focus{box-shadow:none;border:none;}
  .copybtn{
    position:absolute;
    top:12px;
    left:12px;
    background:var(--clay);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:7px;
    font-size:12.5px;
    cursor:pointer;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
  }
  .copybtn:active{transform:translateY(1px);}
  .warn{
    background:#fbe9df;
    border:1px solid var(--clay);
    color:#7a3e1f;
    padding:10px 12px;
    border-radius:8px;
    font-size:12.5px;
    margin-top:10px;
    display:none;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:30px;
    font-family:var(--mono);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>مولّد تقرير المبيعات</h1>
    <span>SALES → BRANCH REPORT</span>
  </header>

  <div class="card">
    <h2><span class="num">1</span>عنوان التقرير</h2>
    <input type="text" id="title" placeholder="مثال: مبيعات شبشب رجالي HRM">
  </div>

  <div class="card">
    <h2><span class="num">2</span>بيانات الفروع</h2>
    <label>الصق الجدول (LocationCode / TotalQty) أو ارفع ملف Excel</label>
    <textarea id="pasteData" placeholder="LocationCode&#9;TotalQty&#9;TotalSellingPrice
701&#9;87&#9;783.00
706&#9;18&#9;162.00"></textarea>
    <div class="row">
      <label class="filebtn">
        📄 رفع ملف Excel / CSV
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      </label>
      <span class="hint" id="fileName"></span>
    </div>
    <div class="warn" id="warnBox"></div>
  </div>

  <div class="card">
    <h2><span class="num">3</span>أسماء الفروع (LocationCode)</h2>
    <table class="map" id="mapTable">
      <tr><th style="width:90px">الكود</th><th>اسم الفرع</th><th style="width:30px"></th></tr>
    </table>
    <button class="addrow" id="addRow" type="button">+ إضافة فرع</button>
  </div>

  <button class="generate" id="genBtn" type="button">توليد التقرير</button>

  <div class="card output-wrap" style="margin-top:18px;">
    <h2><span class="num">4</span>النتيجة</h2>
    <button class="copybtn" id="copyBtn" type="button">نسخ</button>
    <textarea id="output" readonly></textarea>
  </div>

  <footer>يحفظ المتصفح أسماء الفروع تلقائيًا لديك للاستخدام القادم</footer>
</div>

<script>
const RLM = '\u200f';
const STORAGE_KEY = 'branchMap_v1';

const defaultMap = [
  ['701','الدائري'],
  ['706','الفيحاء'],
  ['707','البديعة'],
  ['711','القصيم'],
  ['803','التحلية']
];

function loadMap(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return defaultMap;
}

function saveMap(map){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); }catch(e){}
}

const mapTable = document.getElementById('mapTable');

function renderMap(map){
  mapTable.querySelectorAll('tr.entry').forEach(r=>r.remove());
  map.forEach(([code,name])=> addMapRow(code,name));
}

function addMapRow(code='', name=''){
  const tr = document.createElement('tr');
  tr.className = 'entry';
  tr.innerHTML = `
    <td><input class="code" type="text" value="${code}"></td>
    <td><input class="name" type="text" value="${name}"></td>
    <td><button class="del" type="button" title="حذف">✕</button></td>
  `;
  tr.querySelector('.del').addEventListener('click', ()=>{ tr.remove(); persistMap(); });
  tr.querySelectorAll('input').forEach(inp=> inp.addEventListener('change', persistMap));
  mapTable.appendChild(tr);
}

function currentMap(){
  return [...mapTable.querySelectorAll('tr.entry')].map(tr=>[
    tr.querySelector('.code').value.trim(),
    tr.querySelector('.name').value.trim()
  ]).filter(([c,n])=> c!=='' );
}

function persistMap(){ saveMap(currentMap()); }

document.getElementById('addRow').addEventListener('click', ()=>{ addMapRow(); });

renderMap(loadMap());

function showWarn(msg){
  const box = document.getElementById('warnBox');
  if(!msg){ box.style.display='none'; box.textContent=''; return; }
  box.style.display='block';
  box.textContent = msg;
}

function parsePastedText(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l!=='');
  const rows = [];
  for(const line of lines){
    // يفصل حسب أي مسافة أو تاب، بغض النظر عن كيفية لصق الجدول (يدعم أكثر من جدول ملصوق معًا)
    const cells = line.split(/[\t,]+|\s+/).filter(c=>c!=='');
    if(cells.length < 2) continue;
    const code = cells[0].trim();
    const qty = parseFloat(cells[1].toString().replace(/[^\d.\-]/g,''));
    if(!code || code.toLowerCase().includes('locationcode')) continue;
    if(isNaN(qty)) continue;
    rows.push({code, qty});
  }
  return rows;
}

function parseSheetRows(json){
  const rows = [];
  for(const r of json){
    const codeKey = Object.keys(r).find(k=> k.toLowerCase().replace(/\s/g,'') === 'locationcode') || Object.keys(r)[0];
    const qtyKey = Object.keys(r).find(k=> k.toLowerCase().replace(/\s/g,'') === 'totalqty') || Object.keys(r)[1];
    const code = (r[codeKey] ?? '').toString().trim();
    const qty = parseFloat((r[qtyKey] ?? '').toString().replace(/[^\d.\-]/g,''));
    if(!code || isNaN(qty)) continue;
    rows.push({code, qty});
  }
  return rows;
}

let uploadedRows = null;

document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('fileName').textContent = file.name;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      let rows = [];
      wb.SheetNames.forEach(name=>{
        const json = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''});
        rows = rows.concat(parseSheetRows(json));
      });
      uploadedRows = rows;
      showWarn(null);
    }catch(err){
      showWarn('تعذّرت قراءة الملف. تأكد أنه بصيغة Excel أو CSV صحيحة.');
      uploadedRows = null;
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById('genBtn').addEventListener('click', function(){
  showWarn(null);
  const title = document.getElementById('title').value.trim();
  const pasted = document.getElementById('pasteData').value.trim();

  let rows = [];
  if(uploadedRows && uploadedRows.length){
    rows = uploadedRows;
  } else if(pasted){
    rows = parsePastedText(pasted);
  }

  if(!rows.length){
    showWarn('لم يتم العثور على بيانات صالحة. الصق الجدول أو ارفع ملف Excel.');
    return;
  }

  const map = Object.fromEntries(currentMap());
  const unknown = [];
  const merged = {};
  for(const {code, qty} of rows){
    const name = map[code];
    if(!name){ unknown.push(code); }
    const key = name || code;
    merged[key] = (merged[key]||0) + qty;
  }

  const sorted = Object.entries(merged).sort((a,b)=> b[1]-a[1]);

  let out = '';
  if(title) out += `*${title}*\n\n`;
  sorted.forEach(([name, qty])=>{
    const qtyStr = Number.isInteger(qty) ? qty : qty.toFixed(2);
    out += `${name}:\n${RLM}${qtyStr} حبة\n\n`;
  });
  out = out.trim();

  document.getElementById('output').value = out;

  if(unknown.length){
    showWarn('أكواد فروع غير معروفة (ظهرت بالكود بدل الاسم): ' + [...new Set(unknown)].join('، ') + ' — أضفها في القسم الثالث.');
  }
});

document.getElementById('copyBtn').addEventListener('click', function(){
  const out = document.getElementById('output');
  out.select();
  navigator.clipboard.writeText(out.value).then(()=>{
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = 'تم النسخ ✓';
    setTimeout(()=> btn.textContent = orig, 1400);
  }).catch(()=>{ document.execCommand('copy'); });
});
</script>
</body>
</html>
